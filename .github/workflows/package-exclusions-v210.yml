name: Verify Android package exclusions (v2.1.0)

# Runs before creating a PR. This is NOT a production release workflow.
on:
  push:
    branches:
      - 'feat/github-excludes-v210-clean'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: package-exclusions-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Go build, vet, tests
    runs-on: ubuntu-latest
    env:
      BUILD_TAGS: with_quic,with_grpc,with_utls,with_acme,with_gvisor,badlinkname,tfogo_checklinkname0,with_tailscale,with_cloudflared,with_openconnect,with_openvpn,with_usbip
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Compare native sing-box sources
        run: |
          set -o pipefail
          bash scripts/check-protocol-copies.sh | sed 's/: ok$/ [OK]/'
      - name: Static checks
        run: |
          test -z "$(gofmt -l service/packageExclude*.go cronjob/packageExcludeJob.go)"
          go vet -tags "$BUILD_TAGS" ./...
      - name: Build (validation binary only)
        run: go build -ldflags="-w -s -checklinkname=0" -tags "$BUILD_TAGS" -o /tmp/2sui-validation .
      - name: All Go tests
        run: go test -tags "$BUILD_TAGS" -ldflags="-checklinkname=0" ./...

  frontend:
    name: Vue / TypeScript build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '25'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Verify approved Android exclusions layout (static contract)
        run: python3 ../checks/check_ui_contract.py src/views/Settings.vue
      - name: Check types and build both frontends
        run: npm run build
